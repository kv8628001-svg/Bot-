name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Assets and Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          echo "Found APK at $APK_FILE"
          cp "$APK_FILE" build-output/PoppoLive-GoldenFlower-AI-Bot.apk
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoppoLive-GoldenFlower-AI-Bot-APK
          path: build-output/PoppoLive-GoldenFlower-AI-Bot.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Poppo Live AI Bot APK v1.0.${{ github.run_number }}"
          body: |
            ## 🤖 Poppo Live Golden Flower AI Predictor Bot (Android APK)
            
            ✅ **অফিসিয়াল অ্যান্ড্রয়েড APK ডাউনলোড লিঙ্ক**
            - **App Name**: Poppo Live Golden Flower AI Predictor & Bot
            - **Package ID**: `com.poppolive.aibot`
            - **Build Number**: `${{ github.run_number }}`
            - **Direct Download**: [PoppoLive-GoldenFlower-AI-Bot.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/PoppoLive-GoldenFlower-AI-Bot.apk)
            
            ### 📱 ইন্সটল করার নিয়ম:
            1. সরাসরি উপরের লিঙ্ক অথবা নিচের **Assets** সেকশন থেকে `PoppoLive-GoldenFlower-AI-Bot.apk` ফাইলটি ডাউনলোড করুন।
            2. আপনার অ্যান্ড্রয়েড মোবাইলে ফাইলটি ওপেন করে Install করুন (Allow Unknown Sources চাইলে Allow দিন)।
            3. Poppo Live ওপেন করে গোল্ডেন ফ্লাওয়ার গেম চলাকালীন বটের লাইভ প্রেডিকশন এবং সিগনাল উপভোগ করুন।
          files: build-output/PoppoLive-GoldenFlower-AI-Bot.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
