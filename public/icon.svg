<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#141f48"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6"/>

  <!-- Golden Flower Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="16 12" filter="url(#glow)" opacity="0.7"/>

  <!-- Three Cards Representation (Houses A, B, C) -->
  <!-- Card A (Left) -->
  <g transform="translate(140, 240) rotate(-18)">
    <rect x="-45" y="-70" width="90" height="135" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="4"/>
    <text x="-25" y="-35" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff">A</text>
    <text x="0" y="15" font-family="sans-serif" font-size="34" fill="#38bdf8" text-anchor="middle">♠</text>
  </g>

  <!-- Card C (Right) -->
  <g transform="translate(372, 240) rotate(18)">
    <rect x="-45" y="-70" width="90" height="135" rx="12" fill="#831843" stroke="#f43f5e" stroke-width="4"/>
    <text x="-25" y="-35" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff">C</text>
    <text x="0" y="15" font-family="sans-serif" font-size="34" fill="#fb923c" text-anchor="middle">♦</text>
  </g>

  <!-- Card B (Center Winner) -->
  <g transform="translate(256, 210)">
    <rect x="-55" y="-85" width="110" height="165" rx="14" fill="#065f46" stroke="url(#gold)" stroke-width="5" filter="url(#glow)"/>
    <text x="-35" y="-45" font-family="sans-serif" font-weight="bold" font-size="34" fill="#ffffff">B</text>
    <text x="0" y="18" font-family="sans-serif" font-size="44" fill="#4ade80" text-anchor="middle">👑</text>
    <text x="0" y="60" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fde047" text-anchor="middle">WIN</text>
  </g>

  <!-- Golden Flower Emblem at Bottom -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#gold)" stroke-width="4"/>
    <path d="M 0 -28 C 12 -12 28 -12 28 0 C 12 12 12 28 0 28 C -12 28 -12 12 -28 0 C -28 -12 -12 -12 0 -28 Z" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>

  <!-- Sparkles -->
  <polygon points="120,110 126,126 142,132 126,138 120,154 114,138 98,132 114,126" fill="#fde047"/>
  <polygon points="390,110 396,126 412,132 396,138 390,154 384,138 368,132 384,126" fill="#38bdf8"/>
</svg>
